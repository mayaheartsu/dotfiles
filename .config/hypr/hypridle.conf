general {
    lock_cmd = noctalia msg lock-screen lock    # Triggers Noctalia v5's lock screen
    before_sleep_cmd = loginctl lock-session    # Locks screen before system suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Restores display signal on wake
}

listener {
    timeout = 600                                # 10min
    on-timeout = brightnessctl -s set 10         # Set monitor backlight to minimum (OLED safe)
    on-resume = brightnessctl -r                 # Restore monitor backlight
}

# listener {
    # timeout = 150                                          # 2.5min
    # on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # Turn off keyboard backlight
    # on-resume = brightnessctl -rd rgb:kbd_backlight        # Turn on keyboard backlight
# }

listener {
    timeout = 630                                 # 10.5min
    on-timeout = loginctl lock-session            # Locks screen via Noctalia
}

listener {
    timeout = 900                                # 15min
    on-timeout = hyprctl dispatch dpms off        # Turn off display signal
    on-resume = hyprctl dispatch dpms on          # Turn display signal back on on input
}

listener {
    timeout = 1200                                # 20min
    on-timeout = systemctl suspend                # Suspend system
}
