[accessibility]
ui_scale = 1.1500000096857548

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.97999997809529305
    capsule = true
    capsule_radius = 4
    center = [ "active_window" ]
    end = [ "group:g2", "group:g3", "group:g4", "group:g5" ]
    margin_ends = 0
    padding = 2
    radius = 0
    start = [ "group:g6", "group:g1" ]
    thickness = 32

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "temp", "ram", "sysmon" ]
        opacity = 1.0
        padding = 6.0
        radius = 4.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "lyrics", "now-playing", "audio_visualizer", "media" ]
        opacity = 1.0
        padding = 6.0
        radius = 4.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "tray", "clipboard", "wallpaper" ]
        opacity = 1.0
        padding = 6.0
        radius = 4.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "network", "bluetooth", "volume", "brightness", "battery" ]
        opacity = 1.0
        padding = 6.0
        radius = 4.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g5"
        members = [ "notifications", "clock", "session" ]
        opacity = 1.0
        padding = 6.0
        radius = 4.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g6"
        members = [ "launcher", "workspaces" ]
        opacity = 1.0
        padding = 6.0
        radius = 4.0

[control_center]
hidden_tabs = [ "monitor" ]

    [[control_center.shortcuts]]
    type = "weather"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "screen_time"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = true
enabled = true
icon_size = 72
magnification_scale = 1.3500000052154064
radius = 20
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
address = "Denver, United States"

[lockscreen]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
layer = "overlay"
position = "top_center"

[osd.kinds]
media = false

[plugin_settings."h465855hgg/lyrics"]
display_mode = "lyrics"
double_line_auto_fit = false
player_allowlist = [ "sidra", "Sidra" ]
show_translation = false

[plugin_settings."tranzem/media-lyrics"]
panel_size = "large"
player_allowlist = "sidra"

[plugins]
enabled = [ "h465855hgg/lyrics", "tranzem/media-lyrics" ]

[shell]
corner_radius_scale = 0.20000000298023224
font_family = "Inter"
screen_time_enabled = true

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "discord", "prismlauncher", "obs", "hyprtoolkit", "papirus-icons", "yazi" ]

[wallpaper]
directory = "/home/maya/.config/hypr/wallpapers"

    [wallpaper.default]
    path = "/home/maya/.config/hypr/wallpapers/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/maya/.config/hypr/wallpapers/wallpaper.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/maya/.config/hypr/wallpapers/wallpaper.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/maya/.config/hypr/wallpapers/wallpaper.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/maya/.config/hypr/wallpapers/wallpaper.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[weather]
unit = "imperial"

[widget.active_window]
title_scroll = "always"

[widget.audio_visualizer]
bands = 128
centered = false
mirrored = false

[widget.bluetooth]
enabled = false

[widget.clock]
format = "{:%A, %B %d - %-I:%M %p}"

[widget.cpu]
display = "text"
visualization = "none"

[widget.lyrics]
enable_scroll = false
enabled = false
hide_when_no_lyrics = true
hide_when_paused = true
show_artist = false
show_cover = false
show_glyph = false
type = "h465855hgg/lyrics:lyrics"

[widget.media]
artist_first = true
enabled = false
hide_album_art = true
max_length = 240
title_scroll = "on_hover"

    [widget.media.actions]
    back = "none"
    forward = "none"
    scroll_down = "none"
    scroll_up = "none"

[widget.network]
enabled = false

[widget.now-playing]
enable_scroll = false
hide_album_art = true
hide_when_no_media = true
max_length = 480
show_lyric_line = true
title_scroll = "always"
type = "tranzem/media-lyrics:now-playing"

[widget.ram]
display = "text"
visualization = "none"

[widget.sysmon]
show_value = true
stat = "gpu_temp"
visualization = "none"

[widget.temp]
display = "text"
visualization = "none"

[widget.tray]
drawer = true
drawer_columns = 5
match_adjacent_spacing = true

[widget.workspaces]
focused_output_only = true
